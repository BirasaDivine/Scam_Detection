# Render Blueprint for the ScamGuard API.
# Render dashboard: New > Blueprint > pick this repo. It builds backend/Dockerfile.
# Values you type in: SCAMGUARD_ALLOWED_ORIGIN, DATABASE_URL and SCAMGUARD_ADMIN_TOKEN.
services:
  - type: web
    name: scamguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Your Netlify address, for example https://scamguard-demo.netlify.app (no trailing slash).
      # Several addresses can be separated with commas.
      - key: SCAMGUARD_ALLOWED_ORIGIN
        sync: false
      # Stop the deploy instead of serving the fake mock model if a model file is missing
      - key: SCAMGUARD_REQUIRE_MODEL
        value: "1"
      - key: SCAMGUARD_TIMEOUT_SECONDS
        value: "20"
      # Postgres address for the counts (Neon or Supabase free tier). Render's disk is wiped on restart.
      - key: DATABASE_URL
        sync: false
      # Secret that unlocks the hidden Insights page. Make it long and random.
      - key: SCAMGUARD_ADMIN_TOKEN
        sync: false
